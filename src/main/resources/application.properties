spring.application.name=sistem-informasi
server.port=8080

# --- Konfigurasi Database H2 (In-Memory Database bawaan, siap pakai langsung) ---
spring.datasource.url=jdbc:h2:mem:sisteminformasidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console Web UI (Bisa diakses di http://localhost:8080/h2-console)
spring.h2.console.enabled=true
# --- Konfigurasi JWT (JSON Web Token) ---
app.jwt.secret=9a4f2c8d3b7a1e6f5c8d0e2b4a6c8e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d
app.jwt.expiration-ms=86400000
